name: RemoteOrbit v0.2.15 remote release

on:
  push:
    branches:
      - codex/release-v0.2.15

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remoteorbit-v0.2.15-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.2.15
  RELEASE_BUILD: "44"
  RELEASE_PR: "25"

jobs:
  build-merge-release:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch identity
        shell: zsh {0}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$GITHUB_REF_NAME" = "codex/release-v0.2.15"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' remote-orbit/Packaging/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' remote-orbit/Packaging/Info.plist)"
          test "$VERSION" = "$RELEASE_VERSION"
          test "$BUILD" = "$RELEASE_BUILD"
          test -f RELEASE_NOTES_v0.2.15.md
          echo "CANDIDATE_HEAD=$GITHUB_SHA"

      - name: Swift tests
        working-directory: remote-orbit
        run: swift test

      - name: Protocol self-tests
        working-directory: remote-orbit
        run: ./run-self-tests.sh

      - name: Build candidate DMG
        run: ./package-dmg.sh

      - name: Verify candidate app and DMG
        shell: zsh {0}
        run: |
          set -euo pipefail
          APP="remote-orbit/dist/RemoteOrbit.app"
          BIN="$APP/Contents/MacOS/RemoteOrbit"
          DMG="dist/RemoteOrbit-$RELEASE_VERSION.dmg"

          test -d "$APP"
          test -f "$BIN"
          test -f "$DMG"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.lost0rz.RemoteOrbit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$RELEASE_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RemoteOrbitDiagnosticSourceHead' "$APP/Contents/Info.plist")" = "$GITHUB_SHA"

          ARCHS="$(lipo -archs "$BIN")"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]

          codesign --verify --deep --strict --verbose=2 "$APP"
          REQ="$(codesign -d -r- "$APP" 2>&1)"
          [[ "$REQ" == *'identifier "com.lost0rz.RemoteOrbit"'* ]]

          CANDIDATE_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "CANDIDATE_DMG_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"

          MOUNT="$(mktemp -d /private/tmp/remoteorbit-dmg.XXXXXX)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rm -rf "$MOUNT"' EXIT
          test -d "$MOUNT/RemoteOrbit.app"
          test -L "$MOUNT/Applications"
          test -d "$MOUNT/Documentation"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MOUNT/RemoteOrbit.app/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MOUNT/RemoteOrbit.app/Contents/Info.plist")" = "$RELEASE_BUILD"
          hdiutil detach "$MOUNT" >/dev/null
          trap - EXIT
          rm -rf "$MOUNT"

      - name: Mark PR ready and merge verified candidate
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          LIVE_HEAD="$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$LIVE_HEAD" = "$GITHUB_SHA"

          IS_DRAFT="$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$IS_DRAFT" == "true" ]]; then
            gh pr ready "$RELEASE_PR" --repo "$GITHUB_REPOSITORY"
          fi

          gh pr merge "$RELEASE_PR" --merge --repo "$GITHUB_REPOSITORY"

          MERGED="$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '(.state == "MERGED") and (.mergedAt != null)')"
          test "$MERGED" = "true"
          MERGE_SHA="$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact merged release commit
        shell: zsh {0}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout --detach "${{ steps.merge.outputs.merge_sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.merge_sha }}"

      - name: Rebuild exact merged release DMG
        run: ./package-dmg.sh

      - name: Verify merged release provenance
        shell: zsh {0}
        run: |
          set -euo pipefail
          APP="remote-orbit/dist/RemoteOrbit.app"
          BIN="$APP/Contents/MacOS/RemoteOrbit"
          DMG="dist/RemoteOrbit-$RELEASE_VERSION.dmg"
          MERGE_SHA="${{ steps.merge.outputs.merge_sha }}"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.lost0rz.RemoteOrbit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$RELEASE_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RemoteOrbitDiagnosticSourceHead' "$APP/Contents/Info.plist")" = "$MERGE_SHA"

          ARCHS="$(lipo -archs "$BIN")"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$APP"

          RELEASE_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "RELEASE_DMG_SHA256=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "$RELEASE_SHA  $DMG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteOrbit-0.2.15-dmg
          path: dist/RemoteOrbit-0.2.15.dmg
          if-no-files-found: error

      - name: Create annotated tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          MERGE_SHA="${{ steps.merge.outputs.merge_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists; refusing to overwrite."
            exit 1
          fi

          git tag -a "v$RELEASE_VERSION" "$MERGE_SHA" -m "RemoteOrbit v$RELEASE_VERSION"
          git push origin "refs/tags/v$RELEASE_VERSION"

          gh release create "v$RELEASE_VERSION" \
            "dist/RemoteOrbit-$RELEASE_VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RemoteOrbit v$RELEASE_VERSION" \
            --notes-file RELEASE_NOTES_v0.2.15.md

          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets
