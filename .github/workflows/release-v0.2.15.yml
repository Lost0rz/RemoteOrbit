name: RemoteOrbit v0.2.15 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.15.yml

permissions:
  contents: write

concurrency:
  group: remoteorbit-release-v0.2.15
  cancel-in-progress: false

env:
  TARGET_SHA: 7f1c763e60db8c9ecc4a696f4246d3ee9eaaea1a
  RELEASE_TAG: v0.2.15
  RELEASE_NAME: RemoteOrbit v0.2.15
  DMG_NAME: RemoteOrbit-0.2.15.dmg

jobs:
  publish:
    name: Verify, package and publish v0.2.15
    runs-on: [self-hosted, macOS, ARM64, remoteorbit]
    timeout-minutes: 60

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          path: meta
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact release baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: src
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' src/remote-orbit/Packaging/Info.plist)" = "0.2.15"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' src/remote-orbit/Packaging/Info.plist)" = "44"
          test -f meta/RELEASE_NOTES_v0.2.15.md

      - name: Protocol self-tests
        shell: bash
        working-directory: src
        run: ./remote-orbit/run-self-tests.sh

      - name: Full Swift tests
        shell: bash
        working-directory: src/remote-orbit
        run: swift test

      - name: Build release DMG
        shell: bash
        working-directory: src
        run: ./package-dmg.sh

      - name: Verify packaged release
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          dmg="dist/$DMG_NAME"
          app="remote-orbit/dist/RemoteOrbit.app"
          test -f "$dmg"
          test -x "$app/Contents/MacOS/RemoteOrbit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "0.2.15"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "44"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RemoteOrbitDiagnosticSourceHead' "$app/Contents/Info.plist")" = "$TARGET_SHA"
          architectures="$(lipo -archs "$app/Contents/MacOS/RemoteOrbit")"
          test "$architectures" = "arm64 x86_64" || test "$architectures" = "x86_64 arm64"
          codesign --verify --deep --strict "$app"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create or reconcile GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          tag = os.environ['RELEASE_TAG']
          name = os.environ['RELEASE_NAME']
          body = pathlib.Path('meta/RELEASE_NOTES_v0.2.15.md').read_text()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'RemoteOrbit-release-workflow',
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f'{method} {url} failed: {exc.code} {raw.decode(errors="replace")}')

          status, ref = request('GET', f'{api}/git/ref/tags/{tag}')
          if status != 404 and ref['object']['sha'] != target:
              raise SystemExit(f'tag {tag} already points to {ref["object"]["sha"]}, expected {target}')

          status, release = request('GET', f'{api}/releases/tags/{tag}')
          payload = {
              'tag_name': tag,
              'target_commitish': target,
              'name': name,
              'body': body,
              'draft': False,
              'prerelease': False,
          }
          if status == 404:
              _, release = request('POST', f'{api}/releases', payload)
          else:
              _, release = request('PATCH', f'{api}/releases/{release["id"]}', payload)

          _, assets = request('GET', f'{api}/releases/{release["id"]}/assets')
          for asset in assets:
              if asset['name'] in {'RemoteOrbit-0.2.15.dmg', 'RemoteOrbit-0.2.15.dmg.sha256'}:
                  request('DELETE', f'{api}/releases/assets/{asset["id"]}')

          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'RELEASE_ID={release["id"]}\n')
          PY

      - name: Upload DMG and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/x-apple-diskimage" \
            --data-binary @"src/dist/$DMG_NAME" \
            "$base?name=$DMG_NAME" >/tmp/remoteorbit-release-dmg.json
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: text/plain" \
            --data-binary @"src/dist/$DMG_NAME.sha256" \
            "$base?name=$DMG_NAME.sha256" >/tmp/remoteorbit-release-sha.json

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          tag = os.environ['RELEASE_TAG']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'RemoteOrbit-release-workflow',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          api = f'https://api.github.com/repos/{repo}'
          ref = get(f'{api}/git/ref/tags/{tag}')
          if ref['object']['sha'] != target:
              raise SystemExit(f'tag mismatch: {ref["object"]["sha"]} != {target}')
          release = get(f'{api}/releases/tags/{tag}')
          if release['draft'] or release['prerelease']:
              raise SystemExit('release is not final')
          names = {asset['name'] for asset in release['assets']}
          required = {'RemoteOrbit-0.2.15.dmg', 'RemoteOrbit-0.2.15.dmg.sha256'}
          if not required.issubset(names):
              raise SystemExit(f'missing assets: {sorted(required - names)}')
          print(f'Published {release["html_url"]}')
          print(f'Tag target: {ref["object"]["sha"]}')
          print(f'Assets: {sorted(names)}')
          PY
