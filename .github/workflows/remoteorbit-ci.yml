name: RemoteOrbit CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      stage:
        description: "Default: plan only. Select focused and enter a catalog test ID to execute one lane."
        type: choice
        required: true
        default: none
        options: [focused, milestone, ready, release, none]
      focused_test:
        description: "Capability ID, required when stage=focused"
        type: string
        required: false
      comparison_base:
        description: "Accepted ancestor commit SHA for manual milestone/ready scope"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: remoteorbit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  governed:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: Lost0rz/Engineering-Governance/.github/workflows/ci-router-reusable.yml@v0.10.0
    with:
      capabilities_path: .github/ci-capabilities.json
      stage: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'auto' }}
      focused_test: ${{ inputs.focused_test || '' }}
      comparison_base: ${{ inputs.comparison_base || '' }}
