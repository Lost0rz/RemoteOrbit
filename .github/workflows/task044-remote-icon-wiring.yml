name: Task 044 remote icon wiring

on:
  push:
    branches:
      - codex/brand-icon-unification-044

permissions:
  contents: write

jobs:
  wire-menu-icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: codex/brand-icon-unification-044
          fetch-depth: 0

      - name: Wire canonical RemoteOrbit menu-bar mark
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("remote-orbit/Sources/RemoteOrbit/main.swift")
          text = path.read_text(encoding="utf-8")

          replacement = '''    private func setStatusIcon(systemName _: String, color _: NSColor = .white) {
              let image = ProductBrandMark.menuBarTemplateImage(size: 18)
              statusItem?.button?.image = image
              statusItem?.button?.title = ""
              statusItem?.button?.imageScaling = .scaleProportionallyDown
              statusItem?.button?.contentTintColor = nil
          }

          @objc private func quit()'''

          if "ProductBrandMark.menuBarTemplateImage(size: 18)" in text:
              print("menu-bar mark already wired")
          else:
              pattern = re.compile(
                  r"    private func setStatusIcon\(systemName: String, color: NSColor = \.white\) \{\n"
                  r".*?"
                  r"\n    \}\n\n"
                  r"    @objc private func quit\(\)",
                  re.S,
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"expected one setStatusIcon implementation, found {count}")
              path.write_text(updated, encoding="utf-8")
              print("wired RemoteOrbit template mark")

      - name: Source boundary checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ProductBrandMark.menuBarTemplateImage(size: 18)' remote-orbit/Sources/RemoteOrbit/main.swift
          grep -F 'image.isTemplate = true' remote-orbit/Sources/RemoteOrbit/ProductBranding.swift
          grep -F 'Image(nsImage: NSApp.applicationIconImage)' remote-orbit/Sources/RemoteOrbit/ProductBranding.swift
          test -s remote-orbit/Brand/RemoteOrbitMark.svg

      - name: Commit and push bounded wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- remote-orbit/Sources/RemoteOrbit/main.swift; then
            echo "No source diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-orbit/Sources/RemoteOrbit/main.swift
          git commit -m "ui: wire canonical RemoteOrbit menu bar mark"
          git push origin HEAD:codex/brand-icon-unification-044
